services:
  # ----- Submission UI -----
  # -----------------------------------------
  submissionUI:
    image: harbor.federated-analytics.ac.uk/5s-tes/submission-ui:${DEPLOYMENT_VERSION}
    container_name: submissionUI
    restart: always
    networks:
      - sub-net
    ports:
      - 7220:8080
      - 8888:8080
    depends_on:
      - submissionAPI
    volumes:
      - data-protection:/root/.aspnet/DataProtection-Keys
    env_file:
      - ../../env_files/sub-shared.env
      - ../../env_files/sub-ui.env

  # ----- Submission API -----
  # ----------------------------------

  submissionAPI:
    image: harbor.federated-analytics.ac.uk/5s-tes/submission-api:${DEPLOYMENT_VERSION}
    container_name: submissionAPI
    restart: always
    networks:
      - sub-net
    ports:
      - 5034:8080
    volumes:
      - data-protection:/root/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
      start_interval: 5s
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minioSubmission:
        condition: service_healthy
    env_file:
      - ../../env_files/sub-shared.env
      - ../../env_files/sub-api.env
